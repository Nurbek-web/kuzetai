name: kuzet-controlled-pilot

# The NVIDIA data plane remains a separate, digest-pinned container on the
# target host. This project provisions one shared control plane for one exact
# reviewed site and never launches one model stack per camera.

x-service-hardening: &service-hardening
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-api-image: &api-image
  image: ${PILOT_API_IMAGE_REPOSITORY:?set-reviewed-api-repository}@sha256:${PILOT_API_IMAGE_SHA256:?set-reviewed-64hex-content-digest}
  user: "10001:10001"

services:
  postgres:
    <<: *service-hardening
    image: postgres:17.5-bookworm@sha256:fbcea1bd13b6a882cd6caa6b58db3ae5c102efe50ec625b3e2a5cbc50db5bfe4
    user: "999:999"
    environment:
      POSTGRES_DB: kuzet_pilot
      POSTGRES_USER: kuzet_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m,uid=999,gid=999,mode=0700
    networks:
      - data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kuzet_bootstrap", "-d", "kuzet_pilot"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    deploy:
      resources:
        limits: {cpus: "2.0", memory: 2G}

  role-bootstrap:
    <<: [*service-hardening, *api-image]
    restart: "no"
    entrypoint: ["python", "/app/scripts/pilot/bootstrap_roles.py"]
    command:
      - --phase=ensure
      - --admin-database-url-secret=/run/secrets/admin_database_url
      - --migrator-password-secret=/run/secrets/migrator_database_password
      - --api-password-secret=/run/secrets/api_database_password
      - --retention-password-secret=/run/secrets/retention_database_password
    secrets:
      - admin_database_url
      - migrator_database_password
      - api_database_password
      - retention_database_password
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - data
    depends_on:
      postgres: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  migrate:
    <<: [*service-hardening, *api-image]
    restart: "no"
    entrypoint: ["python", "/app/scripts/pilot/migrate.py"]
    command:
      - --database-url-secret=/run/secrets/migration_database_url
      - --config=/app/alembic.ini
    secrets:
      - migration_database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - data
    depends_on:
      role-bootstrap: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  role-grants:
    <<: [*service-hardening, *api-image]
    restart: "no"
    entrypoint: ["python", "/app/scripts/pilot/bootstrap_roles.py"]
    command:
      - --phase=grants
      - --admin-database-url-secret=/run/secrets/admin_database_url
    secrets:
      - admin_database_url
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - data
    depends_on:
      migrate: {condition: service_completed_successfully}
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  provision:
    <<: [*service-hardening, *api-image]
    restart: "no"
    entrypoint: ["python", "/app/scripts/pilot/provision.py"]
    command:
      - --database-url-secret=/run/secrets/migration_database_url
      - --site-id=${PILOT_SITE_ID:?set-authoritative-site-id}
      - --site-name=${PILOT_SITE_NAME:?set-authoritative-site-name}
      - --timezone=${PILOT_SITE_TIMEZONE:-Asia/Almaty}
      - --site-config=/run/config/site.yaml
      - --site-config-sha256=${PILOT_SITE_CONFIG_SHA256:?set-reviewed-site-config-sha256}
      - --runtime-manifest=/run/config/runtime-manifest.yaml
      - --runtime-manifest-sha256=${PILOT_RUNTIME_MANIFEST_SHA256:?set-reviewed-runtime-manifest-sha256}
      - --measured-capacity-report=/run/config/measured-capacity.yaml
      - --measured-capacity-sha256=${PILOT_MEASURED_CAPACITY_SHA256:?set-target-measured-capacity-sha256}
      - --measured-capacity-signature=/run/config/measured-capacity.sig
      - --capacity-authority-public-key=/run/config/capacity-authority.pem
      - --runtime-image-id-sha256=${PILOT_RUNTIME_IMAGE_ID_SHA256:?set-measured-runtime-image-id-sha256}
      - --runtime-image-config-sha256=${PILOT_RUNTIME_IMAGE_CONFIG_SHA256:?set-measured-runtime-image-config-sha256}
      - --runtime-code-sha256=${PILOT_RUNTIME_CODE_SHA256:?set-reviewed-runtime-code-sha256}
      - --mount-contract-sha256=${PILOT_MOUNT_CONTRACT_SHA256:?set-reviewed-mount-contract-sha256}
    secrets:
      - migration_database_url
    volumes:
      - ${PILOT_SITE_CONFIG_PATH:?set-reviewed-site-config-path}:/run/config/site.yaml:ro
      - ${PILOT_RUNTIME_MANIFEST_PATH:?set-reviewed-runtime-manifest-path}:/run/config/runtime-manifest.yaml:ro
      - ${PILOT_MEASURED_CAPACITY_PATH:?set-signed-target-capacity-path}:/run/config/measured-capacity.yaml:ro
      - ${PILOT_MEASURED_CAPACITY_SIGNATURE_PATH:?set-capacity-signature-path}:/run/config/measured-capacity.sig:ro
      - ${PILOT_CAPACITY_AUTHORITY_PUBLIC_KEY_PATH:?set-out-of-band-capacity-authority-key}:/run/config/capacity-authority.pem:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - data
    depends_on:
      role-grants: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 512M}

  api:
    <<: [*service-hardening, *api-image]
    environment:
      PILOT_SITE_ID: ${PILOT_SITE_ID:?set-authoritative-site-id}
      PILOT_PUBLIC_ORIGIN: ${PILOT_PUBLIC_ORIGIN:?set-https-public-origin}
      PILOT_API_WORKERS: "1"
    secrets:
      - database_url
      - session_secret
      - totp_encryption_key
      - machine_token
      - evidence_link_secret
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks:
      control: {ipv4_address: 172.30.0.20}
      data: {}
    depends_on:
      provision: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,urllib.request; token=pathlib.Path('/run/secrets/machine_token').read_text().strip(); request=urllib.request.Request('http://127.0.0.1:8000/internal/health/live',headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(request,timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    deploy:
      resources:
        limits: {cpus: "1.5", memory: 1G}

  acceptance-controller:
    <<: [*service-hardening, *api-image]
    command:
      - protector.pilot.api.acceptance_controller:create_production_acceptance_controller_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "1"
      - --no-proxy-headers
      - --no-server-header
    environment:
      PILOT_SITE_ID: ${PILOT_SITE_ID:?set-authoritative-site-id}
      PILOT_ACCEPTANCE_CAMPAIGN_ID: ${PILOT_ACCEPTANCE_CAMPAIGN_ID:?set-signed-acceptance-campaign-id}
      PILOT_ACCEPTANCE_GATE: ${PILOT_ACCEPTANCE_GATE:?set-8h-or-72h}
      PILOT_ACCEPTANCE_JOURNAL_PATH: /var/lib/kuzet/acceptance/authority.sqlite3
      PILOT_ACCEPTANCE_PROOF_DIR: /var/lib/kuzet/acceptance-proofs
      PILOT_ACCEPTANCE_OFFLINE_ROOT_SPKI_SHA256: ${PILOT_ACCEPTANCE_OFFLINE_ROOT_SPKI_SHA256:?set-out-of-band-offline-root-SPKI-sha256}
    secrets:
      - acceptance_controller_token
    volumes:
      - type: bind
        source: ${PILOT_ACCEPTANCE_OFFLINE_ROOT_PUBLIC_KEY_PATH:?set-offline-root-public-key-path}
        target: /run/config/acceptance/offline-root-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_TRUST_POLICY_PATH:?set-signed-trust-policy-path}
        target: /run/config/acceptance/trust-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_TRUST_POLICY_SIGNATURE_PATH:?set-trust-policy-signature-path}
        target: /run/config/acceptance/trust-policy.sig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_MANIFEST_PATH:?set-signed-acceptance-manifest-path}
        target: /run/config/acceptance/acceptance-manifest.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_MANIFEST_SIGNATURE_PATH:?set-acceptance-manifest-signature-path}
        target: /run/config/acceptance/acceptance-manifest.sig
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_MANIFEST_ROLE_PUBLIC_KEY_PATH:?set-manifest-role-public-key-path}
        target: /run/config/acceptance/manifest-role-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_CAPACITY_ROLE_PUBLIC_KEY_PATH:?set-capacity-role-public-key-path}
        target: /run/config/acceptance/capacity-role-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_RUN_ROLE_PUBLIC_KEY_PATH:?set-run-role-public-key-path}
        target: /run/config/acceptance/run-role-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_REPORT_ROLE_PUBLIC_KEY_PATH:?set-report-role-public-key-path}
        target: /run/config/acceptance/report-role-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_CONDITIONAL_ROLE_PUBLIC_KEY_PATH:?set-conditional-role-public-key-path}
        target: /run/config/acceptance/conditional-role-public.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_RUN_PRIVATE_KEY_PATH:?set-run-private-key-path}
        target: /run/keys/acceptance/run-private.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_STATE_PATH:?set-persistent-acceptance-state-path}/authority.sqlite3
        target: /var/lib/kuzet/acceptance/authority.sqlite3
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_STATE_PATH:?set-persistent-acceptance-state-path}/authority.sqlite3-wal
        target: /var/lib/kuzet/acceptance/authority.sqlite3-wal
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_STATE_PATH:?set-persistent-acceptance-state-path}/authority.sqlite3-shm
        target: /var/lib/kuzet/acceptance/authority.sqlite3-shm
        read_only: false
        bind:
          create_host_path: false
      - type: bind
        source: ${PILOT_ACCEPTANCE_PROOF_PATH:?set-private-gate-specific-acceptance-proof-path}
        target: /var/lib/kuzet/acceptance-proofs
        read_only: false
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${PILOT_ACCEPTANCE_PORT:?set-loopback-acceptance-port}:8000"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - acceptance-loopback
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import pathlib,urllib.request; token=pathlib.Path('/run/secrets/acceptance_controller_token').read_text().strip(); request=urllib.request.Request('http://127.0.0.1:8000/ready',headers={'Authorization':'Bearer '+token}); urllib.request.urlopen(request,timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  notifications:
    <<: [*service-hardening, *api-image]
    entrypoint: ["python", "-m", "protector.pilot.notifications.service"]
    command:
      - --database-url-secret=/run/secrets/database_url
      - --machine-token-secret=/run/secrets/machine_token
      - --evidence-link-secret=/run/secrets/evidence_link_secret
      - --telegram-bot-token-secret=/run/secrets/telegram_bot_token
      - --telegram-chat-id-secret=/run/secrets/telegram_chat_id
      - --site-id=${PILOT_SITE_ID:?set-authoritative-site-id}
      - --public-origin=${PILOT_PUBLIC_ORIGIN:?set-https-public-origin}
      - --control-plane-url=http://api:8000
      - --customer-approved=${PILOT_TELEGRAM_CUSTOMER_APPROVED:?set-true-only-after-approval}
      - --network-approved=${PILOT_TELEGRAM_NETWORK_APPROVED:?set-true-only-after-network-approval}
    secrets:
      - database_url
      - machine_token
      - evidence_link_secret
      - telegram_bot_token
      - telegram_chat_id
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - control
      - data
      - egress
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  retention:
    <<: [*service-hardening, *api-image]
    entrypoint: ["python", "-m", "protector.pilot.retention_service"]
    command:
      - --database-url-secret=/run/secrets/retention_database_url
      - --access-key-secret=/run/secrets/object_store_access_key
      - --secret-key-secret=/run/secrets/object_store_secret_key
      - --archive-age-recipient=/run/secrets/audit_archive_age_recipient
      - --archive-signing-private-key=/run/secrets/audit_archive_signing_private_key
      - --archive-signing-public-key=/run/secrets/audit_archive_signing_public_key
      - --archive-signing-key-id=${PILOT_AUDIT_ARCHIVE_SIGNING_KEY_ID:?set-audit-signing-key-id}
      - --archive-prefix=${PILOT_AUDIT_ARCHIVE_PREFIX:?set-separate-site-scoped-audit-prefix}
      - --site-id=${PILOT_SITE_ID:?set-authoritative-site-id}
      - --site-config=/run/config/site.yaml
      - --site-config-sha256=${PILOT_SITE_CONFIG_SHA256:?set-reviewed-site-config-sha256}
      - --interval-seconds=3600
      - --evidence-batch-size=1000
      - --audit-batch-size=10000
    secrets:
      - retention_database_url
      - object_store_access_key
      - object_store_secret_key
      - audit_archive_age_recipient
      - audit_archive_signing_private_key
      - audit_archive_signing_public_key
    volumes:
      - ${PILOT_SITE_CONFIG_PATH:?set-reviewed-site-config-path}:/run/config/site.yaml:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - data
      - storage-egress
    depends_on:
      provision: {condition: service_completed_successfully}
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 512M}

  tls-proxy:
    <<: *service-hardening
    image: nginx:1.28.0-alpine3.21@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "${PILOT_BIND_ADDRESS:?set-explicit-bind-address}:${PILOT_TLS_PORT:-8443}:8443"
    secrets:
      - tls_certificate
      - tls_private_key
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101,mode=0700
      - /var/run:rw,noexec,nosuid,nodev,size=8m,uid=101,gid=101,mode=0700
    networks:
      control: {ipv4_address: 172.30.0.10}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "--no-check-certificate", "https://127.0.0.1:8443/proxy-live"]
      interval: 15s
      timeout: 3s
      retries: 4
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    deploy:
      resources:
        limits: {cpus: "0.5", memory: 256M}

  prometheus:
    <<: *service-hardening
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle=false
      - --web.enable-admin-api=false
    secrets:
      - machine_token
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
    networks:
      - control
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 20s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    deploy:
      resources:
        limits: {cpus: "1.0", memory: 1G}

networks:
  acceptance-loopback:
    internal: true
  control:
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
  data:
    internal: true
  # These networks must be created and host-firewall-fenced before Compose.
  # See deploy/pilot/NETWORK_POLICY.md. Compose deliberately cannot create an
  # unrestricted egress bridge as a side effect.
  egress:
    external: true
    name: ${PILOT_NOTIFICATION_EGRESS_NETWORK:?set-precreated-notification-egress-network}
  storage-egress:
    external: true
    name: ${PILOT_STORAGE_EGRESS_NETWORK:?set-precreated-storage-egress-network}

volumes:
  postgres_data: {}
  prometheus_data: {}

secrets:
  postgres_admin_password: {external: true}
  admin_database_url: {external: true}
  migration_database_url: {external: true}
  database_url: {external: true}
  retention_database_url: {external: true}
  migrator_database_password: {external: true}
  api_database_password: {external: true}
  retention_database_password: {external: true}
  session_secret: {external: true}
  totp_encryption_key: {external: true}
  machine_token: {external: true}
  acceptance_controller_token: {external: true}
  evidence_link_secret: {external: true}
  object_store_access_key: {external: true}
  object_store_secret_key: {external: true}
  audit_archive_age_recipient: {external: true}
  audit_archive_signing_private_key: {external: true}
  audit_archive_signing_public_key: {external: true}
  telegram_bot_token: {external: true}
  telegram_chat_id: {external: true}
  tls_certificate: {external: true}
  tls_private_key: {external: true}
