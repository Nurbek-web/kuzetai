global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

# Time and size retention are both mandatory Compose command flags.
scrape_configs:
  - job_name: kuzet-pilot-api
    scheme: http
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/machine_token
    static_configs:
      - targets:
          - api:8000
